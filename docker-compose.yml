# Local development stack. Only the HTTP gateway is published on the host.
x-base-deps: &base-deps
  mysql: {condition: service_healthy}
  redis: {condition: service_healthy}
  rabbitmq: {condition: service_healthy}

x-after-auth: &after-auth
  <<: *base-deps
  auth-service: {condition: service_healthy}

x-app-common: &app-common
  restart: unless-stopped
  environment:
    CONFIG_PATH: /app/config/config.yaml
    DATABASE_MYSQL_PASSWORD_FILE: /run/seckill-secrets/mysql_app_password
    MQ_PASSWORD_FILE: /run/seckill-secrets/rabbitmq_password
    JWT_SECRET_FILE: /run/seckill-secrets/jwt_secret
  volumes:
    - secrets_data:/run/seckill-secrets:ro
  depends_on: *base-deps
  networks: [seckill-net]

services:
  secret-init:
    image: alpine:3.21
    command: ["sh", "/init-secrets.sh"]
    network_mode: none
    volumes:
      - secrets_data:/run/seckill-secrets
      - mysql_root_secrets:/run/mysql-root-secret
      - ./deploy/init-secrets.sh:/init-secrets.sh:ro
    restart: "no"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/mysql-root-secret/mysql_root_password
      MYSQL_DATABASE: seckill_shop
      MYSQL_USER: seckill
      MYSQL_PASSWORD_FILE: /run/seckill-secrets/mysql_app_password
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - secrets_data:/run/seckill-secrets:ro
      - mysql_root_secrets:/run/mysql-root-secret:ro
    depends_on:
      secret-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks: [seckill-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks: [seckill-net]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_CONFIG_FILE: /run/seckill-secrets/rabbitmq.conf
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - secrets_data:/run/seckill-secrets:ro
    depends_on:
      secret-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    networks: [seckill-net]

  auth-service:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: auth_service}}
    healthcheck:
      test: ["CMD", "nc", "-z", "auth-service", "50053"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  user-service:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: user_service}}
    depends_on: *after-auth

  product-service:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: product_service}}
    depends_on: *after-auth

  seckill-service:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: seckill_service}}
    depends_on: *after-auth

  order-service:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: order_service}}
    depends_on: *after-auth

  order-create-consumer:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: order_create_consumer}}
    depends_on: *after-auth

  order-cancel-consumer:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: order_cancel_consumer}}
    depends_on: *after-auth

  reservation-relay:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: reservation_relay}}
    depends_on: *after-auth

  order-outbox-relay:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: order_outbox_relay}}
    depends_on: *after-auth

  stock-reconciler:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: stock_reconciler}}
    depends_on: *after-auth

  dlq-consumer:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: dlq_consumer}}
    depends_on: *after-auth

  replay-dead-letter:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: replay_dead_letter}}
    entrypoint: ["/app/service"]
    profiles: [tools]
    restart: "no"
    depends_on: *after-auth

  compensate-dead-letter:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: compensate_dead_letter}}
    entrypoint: ["/app/service"]
    profiles: [tools]
    restart: "no"
    depends_on: *after-auth

  bench-http:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: bench_http}}
    entrypoint: ["/app/service"]
    profiles: [tools]
    restart: "no"
    depends_on: *after-auth

  api-gateway:
    <<: *app-common
    build: {context: ., args: {SERVICE_NAME: api_gateway}}
    depends_on:
      auth-service: {condition: service_healthy}
      user-service: {condition: service_started}
      product-service: {condition: service_started}
      seckill-service: {condition: service_started}
      order-service: {condition: service_started}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 15
      start_period: 20s

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  secrets_data:
  mysql_root_secrets:

networks:
  seckill-net:
    driver: bridge
