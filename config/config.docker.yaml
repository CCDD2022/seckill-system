# Container network addresses. Credentials come from generated files in a named volume.
server:
  port: 8080
  mode: release
  read_timeout: 60
  write_timeout: 60

log:
  level: info
  format: json
  output: console
  file_path: ./logs/app.log
  max_size: 100
  max_backups: 3
  max_age: 30

services:
  api_gateway: {host: 0.0.0.0, port: 8080}
  user_service: {host: user-service, port: 50051}
  product_service: {host: product-service, port: 50052}
  auth_service: {host: auth-service, port: 50053}
  seckill_service: {host: seckill-service, port: 50054}
  order_service: {host: order-service, port: 50055}

database:
  mysql:
    host: mysql
    port: 3306
    user: seckill
    password: ""
    dbname: seckill_shop
    max_open_conns: 30
    max_idle_conns: 10
  redis:
    host: redis
    port: 6379
    password: ""
    db: 0

jwt:
  secret: ""
  expire_hours: 24

mq:
  host: rabbitmq
  port: 5672
  user: seckill
  password: ""
  channel_pool_size: 8
  consumer_prefetch: 10

rate_limits:
  global: {rps: 1000, burst: 2000}
  seckill: {rps: 300, burst: 600}
  order: {rps: 500, burst: 1000}
