name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start local stack
        run: docker compose up -d --build
      - name: Exercise HTTP routes
        run: |
          python3 scripts/error_contract_smoke.py
          sh scripts/seed-demo-product.sh
          SMOKE_FULL=1 python3 scripts/smoke.py
          python3 scripts/concurrency_smoke.py
      - name: Service diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color --tail=100
      - name: Stop local stack
        if: always()
        run: docker compose down -v
